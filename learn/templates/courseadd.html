<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="">
    </head>
    <body>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="text" name="course_name" placeholder="Enter the name">
            <textarea name='course_desc' placeholder="Enter The description"></textarea>
            <input type="text" name="course_tutor_name" placeholder="Enter the tutor's Name">
            <input type="number" name="course_price" placeholder="Enter the Price of the Course">
            <input type="file" name="course_video" placeholder="Enter the course Video">
            <button type="submit">Submit</button>
        </form>
    </body>
</html>
